name: Build Mimic test APK

on:
  push:
    branches:
      - mimic-menu-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Compile debug APK
        id: build
        run: gradle assembleDebug --no-daemon

      - name: Run Android lint
        id: lint
        continue-on-error: true
        run: gradle lintDebug --no-daemon

      - name: Upload test APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mimic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Report lint result
        if: steps.lint.outcome == 'failure'
        run: echo 'APK compilation succeeded, but Android lint reported issues. See the lint step.'
